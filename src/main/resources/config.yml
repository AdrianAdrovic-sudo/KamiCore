# ==========================================
#  DRAGON BALLS  (/scouter dragonballs, /shenron)
# ==========================================
dragonballs:
  world: world             # the balls are hidden in this world
  radius: 1500             # max distance from world spawn
  min-distance: 150        # min distance from world spawn
  return-after: 86400      # after a wish, the balls are stone for this long (24 hours)
  radar-seconds: 20        # how long /scouter dragonballs keeps pointing
  radar-shows-coordinates: false

wishes:
  riches:
    diamonds: 64
    netherite-ingots: 16
    xp-levels: 50
  immortal-body:
    extra-hearts: 10
    days: 7
  unlimited-power:
    minutes: 60
