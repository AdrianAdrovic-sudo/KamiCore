# Terrain destruction from ki attacks (permanent!)
destruction:
  enabled: true
  protect-containers: true      # never destroy chests, barrels, shulker boxes, furnaces...
  max-blast-resistance: 1000    # stronger blocks survive: obsidian, bedrock, ancient debris, netherite...
  drop-items: false             # true = destroyed blocks drop as items
  disabled-worlds: []           # e.g. [world_nether]

# /solarflare - blinds nearby players who can see you
solarflare:
  cooldown: 300            # 5 minutes
  radius: 10
  blind-seconds: 5
  require-line-of-sight: true   # walls protect you
  must-face-caster: true        # players looking away are safe
  affect-mobs: true             # mobs lose their target and slow down

# /scouter - read power levels
scouter:
  cooldown: 15
  show-coordinates: true
  notify-target: true      # tell players when someone scans them

# ==========================================
#  SUPER SAIYAN  (/ssj <form>, /ssj off)
# ==========================================
# Every second a form drains XP points. When you run out, you power down.
# Buffs are effect levels (0 = none). extra-hearts are added to your max health.
# color = glow outline + name color (Minecraft color names: gold, yellow, red, dark_red, aqua, white...)
# aura  = particle color (hex)
# flight-speed  = ki flight speed in blocks per tick (1.0 = 20 blocks/s, like a fast elytra)
# ki-multiplier = makes ki attacks stronger AND bigger (damage, size, range, craters)
# power-multiplier = Scouter power level multiplier
supersaiyan:
  cooldown-after: 30       # seconds before you can transform again after powering down
  glow: true
  forms:
    ssj:
      name: Super Saiyan
      color: gold
      aura: "#FFD700"
      min-level: 5
      xp-drain: 2
      strength: 1
