# ==========================================
#  KamiCore - Dragon Ball powers for KamiSMP
# ==========================================
# All times are in SECONDS.
# After editing, run /kamicore reload (no restart needed).

# Shown before every message. Uses MiniMessage colors: https://docs.advntr.dev/minimessage/format
prefix: "<gradient:#ff8c00:#ffd700><b>KamiSMP</b></gradient> <dark_gray>»</dark_gray> "

# /kimark - save locations ("ki marks") to teleport to later
kimark:
  max-marks: 3

# /shunkan - Instant Transmission to a ki mark or coordinates
shunkan:
  cooldown: 30

# /kisense - ask to teleport to another player
kisense:
  cooldown: 30
  request-timeout: 60      # how long a request stays valid

# /nimbus - toggle flying on the Flying Nimbus
nimbus:
  cooldown: 10
  fly-speed: 0.1           # 0.1 = normal creative flying speed, max 1.0
  dismount-on-hit: true    # getting hit by a mob/player knocks you off

# /senzu - full heal + full hunger
senzu:
  cooldown: 43200          # 12 hours

# /gravity [level] - gravity chamber training for XP
# slowness / mining-fatigue / hunger = effect level (0 = none)
gravity:
  default-level: 50x       # used when you type just /gravity
  levels:
    10x:
      duration: 45
      xp: 60
      slowness: 1
      mining-fatigue: 1
      hunger: 0
      cooldown: 600        # 10 minutes
    50x:
      duration: 60
      xp: 150
      slowness: 2
      mining-fatigue: 1
      hunger: 0
      cooldown: 1200       # 20 minutes
    100x:
      duration: 60
      xp: 300
      slowness: 3
      mining-fatigue: 2
      hunger: 1
      cooldown: 1800       # 30 minutes
    300x:
      duration: 90
      xp: 800
      slowness: 5
      mining-fatigue: 3
      hunger: 2
      cooldown: 3600       # 1 hour

# /kaioken [level] - Strength + Speed, then the body pays for it
# health-cost = part of your MAX health you lose when it ends (0.5 = half)
kaioken:
  default-level: x2
  minimum-health-left: 1.0 # Kaioken never kills you: you keep at least this much HP (1.0 = half a heart)
  levels:
    x2:
      ki-multiplier: 1.15    # ki attacks this much stronger and bigger
      strength: 1
      speed: 1
      duration: 60
      health-cost: 0.15
      strain: 15           # seconds of Weakness + Slowness afterwards
      cooldown: 43200      # 12 hours
    x3:
      ki-multiplier: 1.25    # ki attacks this much stronger and bigger
      strength: 2
      speed: 2
      duration: 45
      health-cost: 0.30
      strain: 25
      cooldown: 64800      # 18 hours
    x10:
      ki-multiplier: 1.5    # ki attacks this much stronger and bigger
      strength: 3
      speed: 2
      duration: 30
      health-cost: 0.55
      strain: 40
      cooldown: 86400      # 24 hours
    x20:
      ki-multiplier: 1.8    # ki attacks this much stronger and bigger
      strength: 4
      speed: 3
      duration: 20
      health-cost: 0.80
      strain: 60
      cooldown: 86400      # 24 hours

# ==========================================
#  KI ATTACKS
# ==========================================
# How they work: type the command to start charging. The longer you charge,
# the higher the level. Release Shift (if you held it) or type the command again to fire.
#
# Per level:
#   charge    = seconds of charging needed to reach the level
#   damage    = damage to the target (2 = one heart). Super Saiyan forms multiply this.
#   range     = how far it travels (blocks)
#   radius    = blast area at the impact point (0 = no blast); 60% damage there
#   knockback = how hard targets get pushed
#   crater    = radius of terrain destroyed at impact (0 = none)
#               (Special Beam Cannon: width of the tunnel it drills)
#   cooldown  = seconds before you can use this attack again

ki-attacks:
  cancel-on-hit: true      # getting hit while charging breaks your focus
  max-hold: 4              # seconds you can hold a full charge before it fires by itself
  max-multiplier: 4.0      # cap for Super Saiyan x Kaioken boosts (e.g. Blue 2.0 x Kaioken x20 1.8 = 3.6)

