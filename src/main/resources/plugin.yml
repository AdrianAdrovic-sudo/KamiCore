name: KamiCore
version: '${version}'
main: com.kamismp.kamicore.KamiCore
api-version: '26.3'
description: Dragon Ball inspired abilities for KamiSMP
author: Adrian

# Commands are registered in code (KamiCore.java), so they are not listed here.
# Permissions are listed here so normal players get them by default.
permissions:
  kamicore.kimark:
    description: Save, delete and list ki marks
    default: true
  kamicore.shunkan:
    description: Instant Transmission to ki marks and coordinates
    default: true
  kamicore.kisense:
    description: Send, accept and deny teleport requests
    default: true
  kamicore.nimbus:
    description: Ride Flying Nimbus
    default: true
  kamicore.senzu:
    description: Eat a Senzu Bean
    default: true
  kamicore.gravity:
    description: Gravity chamber training
    default: true
  kamicore.kaioken:
    description: Use Kaioken
    default: true
  kamicore.kamehameha:
    description: Charge and fire a Kamehameha
    default: true
  kamicore.solarflare:
    description: Use Solar Flare
    default: true
  kamicore.scouter:
    description: Read power levels and locations with the Scouter
    default: true
  kamicore.galickgun:
    description: Charge and fire a Galick Gun
    default: true
  kamicore.finalflash:
    description: Charge and fire a Final Flash
    default: true
  kamicore.specialbeamcannon:
    description: Charge and fire a Special Beam Cannon
    default: true
  kamicore.spiritbomb:
    description: Gather energy for a Spirit Bomb
    default: true
  kamicore.supersaiyan:
    description: Transform into Super Saiyan forms
    default: true
  kamicore.shenron:
    description: Summon Shenron with the Dragon Balls
    default: true
  kamicore.duel:
    description: Challenge players to duels
    default: true
  kamicore.kaioshin:
    description: The Kaioshin role - all admin powers (hakai, banish, seal, timeskip...)
    default: op
    children:
      kamicore.admin: true
  kamicore.bypass.kicost:
    description: Ki attacks cost no XP
    default: op
  kamicore.admin:
    description: Reload the plugin and use /dragonballs
    default: op
  kamicore.bypass.cooldown:
    description: Ignore all KamiCore cooldowns
    default: op
  kamicore.bypass.marklimit:
    description: Save unlimited ki marks
    default: op
